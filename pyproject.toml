[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentron"
version = "0.1.0"
description = "AI-powered penetration testing assistant"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.13.0",
    "beautifulsoup4==4.14.3",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.6",
    "click==8.3.1",
    "colorama==0.4.6",
    "ddgs==9.12.1",
    "duckduckgo_search==8.1.1",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.11",
    "Jinja2==3.1.6",
    "lxml==6.0.2",
    "markdown-it-py==4.0.0",
    "MarkupSafe==3.0.3",
    "mdurl==0.1.2",
    "mysql-connector-python==9.6.0",
    "pillow==12.3.0",
    "primp==1.2.1",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "Pygments==2.20.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "reportlab==4.4.10",
    "requests==2.33.1",
    "rich==14.3.3",
    "soupsieve==2.8.3",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "urllib3==2.6.3",
    "uvicorn==0.53.0",
    "watchfiles==1.2.0",
    "websockets==17.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
dev = [
    "pentron[test]",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pentron = "pentron.cli:main"

[tool.setuptools.packages.find]
include = ["pentron", "pentron.*", "api", "api.*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
