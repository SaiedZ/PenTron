{% extends "base.html" %}
{% block title %}New Scan — PenTron{% endblock %}

{% block content %}
<div class="max-w-xl">
  <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-100">New scan</h1>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
    Only scan targets you are authorized to test.
  </p>

  <form id="scan-form" class="mt-6 space-y-5">
    <div>
      <label for="target" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
        Target IP or domain
      </label>
      <input type="text" id="target" name="target" required placeholder="example.com"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
               focus:border-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-500/30
               dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
    </div>

    <fieldset>
      <legend class="block text-sm font-medium text-slate-700 dark:text-slate-300">Recon tools</legend>
      <div class="mt-2 space-y-2 text-sm">
        <label class="flex items-center gap-2">
          <input type="radio" name="mode" value="a" checked
            class="h-4 w-4 border-slate-300 text-rose-600 focus:ring-rose-500">
          Standard recon (nmap, whois, whatweb, curl headers, dig)
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="mode" value="n"
            class="h-4 w-4 border-slate-300 text-rose-600 focus:ring-rose-500">
          Standard recon + nikto (slower, noisier)
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="mode" value="custom"
            class="h-4 w-4 border-slate-300 text-rose-600 focus:ring-rose-500">
          Custom selection (includes SSL/TLS tools and WAF detection)
        </label>
      </div>

      <div id="custom-tools" class="mt-3 hidden grid grid-cols-2 gap-2 rounded-md border border-slate-200 p-3 text-sm dark:border-slate-800">
        <label class="flex items-center gap-2"><input type="checkbox" value="1" class="tool-key"> nmap</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="2" class="tool-key"> whois</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="3" class="tool-key"> whatweb</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="4" class="tool-key"> curl headers</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="5" class="tool-key"> dig DNS</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="6" class="tool-key"> nikto</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="7" class="tool-key"> sslscan</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="8" class="tool-key"> testssl.sh</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="9" class="tool-key"> wafw00f</label>
        <label class="flex items-center gap-2"><input type="checkbox" value="10" class="tool-key"> robots/security.txt</label>
      </div>
    </fieldset>

    <button type="submit"
      class="rounded-md bg-rose-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-rose-700
             focus:outline-none focus:ring-2 focus:ring-rose-500/40">
      Start scan
    </button>

    <p id="scan-error" class="hidden text-sm text-red-600 dark:text-red-400"></p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const modeRadios = document.querySelectorAll('input[name="mode"]');
  const customBox = document.getElementById('custom-tools');
  modeRadios.forEach(r => r.addEventListener('change', () => {
    customBox.classList.toggle('hidden', document.querySelector('input[name="mode"]:checked').value !== 'custom');
  }));

  document.getElementById('scan-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const target = document.getElementById('target').value.trim();
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const errorEl = document.getElementById('scan-error');
    errorEl.classList.add('hidden');

    let tools = mode;
    if (mode === 'custom') {
      tools = Array.from(document.querySelectorAll('.tool-key:checked')).map(cb => cb.value);
      if (tools.length === 0) {
        errorEl.textContent = 'Select at least one tool.';
        errorEl.classList.remove('hidden');
        return;
      }
    }

    try {
      const resp = await apiFetch('POST', '/api/scans', { target, tools });
      window.location.href = `/scans/${resp.sl_no}`;
    } catch (err) {
      errorEl.textContent = err.message || 'Failed to start scan.';
      errorEl.classList.remove('hidden');
    }
  });
</script>
{% endblock %}
