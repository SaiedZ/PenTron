<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PenTron{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full min-h-screen antialiased" data-page="{% block page_id %}{% endblock %}">
  {% set current_path = request.url.path %}
  <div class="console-texture"></div>
  <div class="console-scanlines"></div>

  <header id="site-nav">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 sm:px-6">
      <a href="/" class="flex items-center gap-2 font-mono text-sm tracking-[0.22em] text-slate-100">
        <svg class="h-5 w-5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        PENTRON
      </a>
      <nav class="hidden items-center gap-8 text-sm text-slate-400 md:flex">
        <a href="/" data-nav="home"
          class="nav-link hover:text-slate-100{% if current_path == '/' %} active{% endif %}"
          {% if current_path == '/' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/new-scan" data-nav="new-scan"
          class="nav-link hover:text-slate-100{% if current_path == '/new-scan' or current_path.startswith('/scans/') %} active{% endif %}"
          {% if current_path == '/new-scan' or current_path.startswith('/scans/') %}aria-current="page"{% endif %}>New Scan</a>
        <a href="/history" data-nav="history"
          class="nav-link hover:text-slate-100{% if current_path.startswith('/history') %} active{% endif %}"
          {% if current_path.startswith('/history') %}aria-current="page"{% endif %}>History</a>
        <a href="/settings" data-nav="settings"
          class="nav-link hover:text-slate-100{% if current_path.startswith('/settings') %} active{% endif %}"
          {% if current_path.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a>
      </nav>
      <a href="/new-scan" class="btn-primary hidden text-xs sm:inline-flex">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" />
        </svg>
        New Scan
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 pt-28 pb-20 sm:px-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-[var(--border)]">
    <div class="mx-auto max-w-7xl px-4 py-8 text-xs text-slate-500 sm:px-6">
      PenTron — AI penetration testing assistant. For authorized use only.
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
