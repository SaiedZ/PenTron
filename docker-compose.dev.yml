services:
  web:
    volumes:
      - ./api:/app/api
      - ./pentron:/app/pentron
      - ./web/templates:/app/web/templates
      - ./web/static/js:/app/web/static/js
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/api
      - --reload-dir
      - /app/pentron
